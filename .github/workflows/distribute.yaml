# Distribution automatique du site vers X (Twitter).
#
# Stratégie d'idempotence :
#   Le fichier d'état (.distribute_state.json) est persisté sur une branche
#   dédiée `distribute-state` (et non dans le repo principal) pour survivre
#   entre les runs. Il mémorise le GUID du dernier article diffusé.
#
# Déclencheur :
#   Uniquement APRÈS le déploiement réussi de Pages (workflow_run -> hugo.yaml).
#   Un post X est publié pour le dernier article du flux RSS (1 post / article).
#
# Réseau actif : X uniquement (DISTRIBUTE_NETWORKS=x).
# Meta / LinkedIn sont ignorés volontairement (clés non configurées).
name: Distribute to X

on:
  workflow_run:
    workflows: ["Deploy Hugo site to Pages"]
    types: [completed]

permissions:
  contents: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer l'état de diffusion (branche distribute-state)
        run: |
          git fetch origin distribute-state:distribute-state || true
          if git show distribute-state:.distribute_state.json >/dev/null 2>&1; then
            git checkout distribute-state -- .distribute_state.json 2>/dev/null || true
            echo "État chargé depuis distribute-state."
          else
            echo "Aucun état existant — premier run."
          fi

      - name: Diffuser le dernier article sur X
        env:
          SITE_URL: "https://voisin71-sys.github.io/fabrica-miracula/"
          DISTRIBUTE_STATE_FILE: "${{ github.workspace }}/.distribute_state.json"
          DISTRIBUTE_NETWORKS: "x"
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/distribute.py

      - name: Sauvegarder l'état de diffusion
        if: always()
        env:
          STATE_PATH: ${{ github.workspace }}/.distribute_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Conserver le fichier d'état généré avant de changer de branche
          cp "$STATE_PATH" /tmp/distribute_state.json
          git fetch origin distribute-state 2>/dev/null || true
          if git rev-parse --verify origin/distribute-state >/dev/null 2>&1; then
            git checkout -B distribute-state origin/distribute-state
          else
            git checkout --orphan distribute-state
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          cp /tmp/distribute_state.json .distribute_state.json
          git add .distribute_state.json
          if git diff --cached --quiet; then
            echo "Pas de changement d'état."
          else
            git commit -m "distribute: update state [skip ci]"
            git push origin distribute-state
          fi
